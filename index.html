<!-- COLE ESTE BLOCO LOGO DEPOIS DO BLOCO DA ABA ANÁLISE (ainda antes de </body>) -->
<script>
/* ── Análise extra: semana a semana + minutos vs resultado ── */
(function(){
const p3=document.getElementById('p3');if(!p3)return;
const sec=document.createElement('section');sec.className='g g2';
sec.innerHTML=`
<div class="card" style="--x:var(--a)"><h3>Semana a semana (últimas 8)</h3><div id="xw"></div><div class="sub" id="xws"></div></div>
<div class="card" style="--x:var(--e)"><h3>Minutos estudados vs. dia seguinte</h3><div id="xm"></div><div class="sub" id="xms"></div></div>`;
p3.insertBefore(sec,p3.lastElementChild);
const q=s=>sec.querySelector(s);
const SC={f:1,p:.5,n:0},pc=v=>v==null?'—':Math.round(v*100)+'%';
const bar=(l,r,v,col)=>`<div class="row" style="margin-top:8px"><span>${l}</span><span>${r}</span></div><div class="bar" style="margin:4px 0"><i style="--x:var(${col});width:${v==null?0:Math.round(v*100)}%"></i></div>`;
const fm=m=>m>=60?Math.floor(m/60)+'h'+String(m%60).padStart(2,'0'):m+'min';

function ex(){
 const c=cur(),R=serie(),sts=R.sts,n=sts.length;
 /* Semanas */
 const W=[];
 for(let w=0;w*7<n;w++){
  let s=0,k=0,m=0;
  for(let i=w*7;i<Math.min(n,w*7+7);i++){m+=(c.d[i]&&c.d[i].m)||0;if(sts[i]!=='r'){k++;s+=SC[sts[i]]}}
  W.push({w,v:k?s/k:null,m,k});
 }
 const L=W.slice(-8);let h='';
 L.forEach((x,j)=>{
  const pv=j?L[j-1]:(W.length>8?W[W.length-9]:null);
  const d=(x.v!=null&&pv&&pv.v!=null)?Math.round((x.v-pv.v)*100):null;
  h+=bar('Sem '+(x.w+1)+' • '+wlabel(x.w),pc(x.v)+(d==null?'':d>0?' ▲'+d:d<0?' ▼'+(-d):' ➖')+(x.m?' • '+fm(x.m):''),x.v,'--a');
 });
 q('#xw').innerHTML=h||'<div class="sub">Sem dados ainda.</div>';
 const ok=L.filter(x=>x.v!=null);
 if(ok.length>1){const b=ok.reduce((a,x)=>x.v>a.v?x:a),p=ok.reduce((a,x)=>x.v<a.v?x:a);
  q('#xws').textContent='Melhor semana: '+(b.w+1)+' ('+pc(b.v)+') • Mais fraca: '+(p.w+1)+' ('+pc(p.v)+'). ▲▼ = variação em pontos vs. a semana anterior.'}
 else q('#xws').textContent='Precisa de pelo menos 2 semanas de registros.';
 /* Minutos x dia seguinte */
 const B=[['até 29 min',0,29],['30 a 59 min',30,59],['60 a 89 min',60,89],['90 min ou mais',90,1440]].map(b=>({l:b[0],lo:b[1],hi:b[2],t:0,y:0}));
 for(let i=0;i<n-1;i++){
  const e=c.d[i],m=e&&e.m;if(!m||(sts[i]!=='f'&&sts[i]!=='p'))continue;
  const nx=sts[i+1];if(nx==='r')continue;
  const b=B.find(x=>m>=x.lo&&m<=x.hi);if(!b)continue;
  b.t++;if(nx==='f'||nx==='p')b.y++;
 }
 q('#xm').innerHTML=B.map(b=>bar(b.l,pc(b.t?b.y/b.t:null)+' • '+b.t+(b.t==1?' dia':' dias'),b.t?b.y/b.t:null,'--e')).join('');
 const v=B.filter(b=>b.t>=3);
 if(v.length>1){const b=v.reduce((a,x)=>x.y/x.t>a.y/a.t?x:a);
  q('#xms').textContent='Depois de dias de '+b.l+', você mais estuda no dia seguinte ('+pc(b.y/b.t)+'). Barras = chance de estudar no dia seguinte.'}
 else q('#xms').textContent='Registre os minutos por dia (mín. 3 dias por faixa) para ver se estudar mais cansa ou anima você.';
}
const oi=info;info=function(){oi();ex()};
ex();
})();
</script>
